crons:
  - name: rs-wa-sweep-08
    description: "Varre documentos e dispara alertas WhatsApp para vencidos, ≤3 dias e ≤30 dias todo dia às 08h (America/Sao_Paulo)"
    cron: "0 8 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/whatsapp-sweep"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: rs-weekly-rank
    description: "Envia toda segunda às 09h o ranking de canais que mais venderam nos últimos 7 dias, via CallMeBot"
    cron: "0 9 * * 1"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/weekly-ranking"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
